<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mia占卜屋 · 塔罗抽牌</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;600;900&family=Yeseva+One&family=ZCOOL+XiaoWei&family=Zhi+Mang+Xing&family=Kaushan+Script&family=Marck+Script&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<canvas id="stars"></canvas>
<div class="frame"><i class="fc tl"></i><i class="fc tr"></i><i class="fc bl"></i><i class="fc br"></i></div>

<header class="site-head">
  <div class="sigil">☾ ✦ ☽</div>
  <h1><span class="mia">Mia</span>占卜屋</h1>
  <p class="tagline">MIA&nbsp;·&nbsp;TAROT&nbsp;HOUSE&nbsp;&nbsp;韦特塔罗七十八牌</p>
</header>

<main>

<!-- ① 起念 -->
<section class="screen active" id="scr-home">
  <h2 class="step-title"><span class="num">壹</span>起念</h2>
  <p class="step-hint">心中默念所问之事，选定主题。心不诚，牌不应。</p>

  <div class="field">
    <label>所问主题</label>
    <div class="chips" id="topic-chips">
      <button class="chip" data-topic="love"><svg class="ic" viewBox="0 0 24 24"><path d="M12 20c-6.2-4-9-7.6-9-11a4.6 4.6 0 0 1 9-1.6A4.6 4.6 0 0 1 21 9c0 3.4-2.8 7-9 11z"/></svg>爱情</button>
      <button class="chip" data-topic="study"><svg class="ic" viewBox="0 0 24 24"><path d="M12 6.5C10 5 7.5 4.5 4 4.5v13c3.5 0 6 .5 8 2 2-1.5 4.5-2 8-2v-13c-3.5 0-6 .5-8 2z"/><path d="M12 6.5v13"/></svg>学业</button>
      <button class="chip" data-topic="career"><svg class="ic" viewBox="0 0 24 24"><rect x="4" y="8" width="16" height="11" rx="1.5"/><path d="M9.5 8V6.5a2.5 2.5 0 0 1 5 0V8"/><path d="M4 13h16"/></svg>事业</button>
      <button class="chip" data-topic="general"><svg class="ic" viewBox="0 0 24 24"><path d="M12 3.5l1.9 6.6 6.6 1.9-6.6 1.9L12 20.5l-1.9-6.6-6.6-1.9 6.6-1.9z"/></svg>综合</button>
    </div>
  </div>

  <div class="field">
    <label for="question">具体问题<span class="opt">（可留空，但问题越具体，牌越聚焦）</span></label>
    <textarea id="question" rows="2" maxlength="120" placeholder="例如：三个月内，他和我的关系会如何发展？"></textarea>
  </div>

  <button class="btn-major" id="go-spreads">静心 · 选牌阵 →</button>
</section>

<!-- ② 选阵 -->
<section class="screen" id="scr-spreads">
  <h2 class="step-title"><span class="num">贰</span>选阵</h2>
  <p class="step-hint">牌阵是提问的骨架，按你的问题形态挑选。</p>
  <div class="spread-grid" id="spread-grid"></div>
  <button class="btn-ghost" data-back="home">← 返回</button>
</section>

<!-- ③ 洗牌 -->
<section class="screen" id="scr-shuffle">
  <h2 class="step-title"><span class="num">叁</span>洗牌</h2>
  <p class="step-hint" id="shuffle-hint">连触牌堆三次，为你切牌。</p>
  <div class="deck-stage">
    <div class="deck" id="deck"></div>
    <div class="deck-count" id="deck-count">搅动 0 圈</div>
    <button class="btn-major" id="btn-gather" style="margin-top:8px" disabled>洗 好 了</button>
  </div>
  <button class="btn-ghost" data-back="spreads">← 换牌阵</button>
</section>

<!-- ④ 抽牌 -->
<section class="screen" id="scr-fan">
  <h2 class="step-title"><span class="num">肆</span>感应</h2>
  <p class="step-hint" id="fan-hint"></p>
  <div class="fan" id="fan"></div>
  <div class="fan-bar">
    <div class="picked-tray" id="picked-tray"></div>
    <button class="btn-major" id="do-deal" disabled>开 牌</button>
  </div>
</section>

<!-- ⑤ 牌阵 -->
<section class="screen" id="scr-board">
  <h2 class="step-title"><span class="num">伍</span>现形</h2>
  <p class="step-hint" id="board-hint">屏息——牌面即将翻转。</p>
  <div class="board" id="board"></div>
</section>

<!-- ⑥ 解读 -->
<section class="screen" id="scr-result">
  <h2 class="step-title"><span class="num">六</span>解牌</h2>
  <div id="result-head" class="result-head"></div>
  <div id="result-cards"></div>
  <div id="result-summary" class="summary"></div>
  <div class="result-actions">
    <button class="btn-major" id="btn-copy"><svg class="ic" viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="1.5"/><path d="M5 15h-.5A1.5 1.5 0 0 1 3 13.5v-9A1.5 1.5 0 0 1 4.5 3h9A1.5 1.5 0 0 1 15 4.5V5"/></svg>复制问卜结果</button>
    <span class="copy-hint" id="copy-hint">复制后贴给 AI，按你的风格做专属深读</span>
    <button class="btn-ghost" id="btn-again">重新抽这个牌阵</button>
    <button class="btn-ghost" id="btn-new">换个问题</button>
  </div>
</section>

</main>

<footer class="site-foot">牌义取自韦特塔罗传统释义 · 仅供娱乐与自我观照</footer>

<div id="zoom" hidden><div class="zoom-box"><img id="zoom-img" alt=""><div id="zoom-cap"></div></div></div>

<script src="cards.js"></script>
<script src="spreads.js"></script>
<script src="app.js"></script>
</body>
</html>
